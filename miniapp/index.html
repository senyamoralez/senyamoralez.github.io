<!doctype html>
<html lang="ru" data-niche="bakery">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Витрина в Telegram</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Yeseva+One&family=Unbounded:wght@600;700&family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Oswald:wght@500;600&display=swap">
<style>
/* Layout: one phone-width app column; on wide screens it sits in a soft frame under a demo strip.
   Each niche commits to its own palette and display face (two light, two dark), set on <html data-niche>. */
:root {
  --page: #E4E6DC;
  --bg: #F1F3EA; --surface: #FFFFFF; --ink: #2A1D15; --muted: #7B6F63;
  --accent: #6E8B3D; --accent-ink: #FFFFFF; --soft: #E3E9D3; --line: #E2E0D6; --sale: #B8442C; --ok: #2E8B57;
  --display: "Yeseva One", Georgia, serif; --display-case: none; --display-weight: 400; --display-style: normal;
  --body: "Manrope", "Segoe UI", system-ui, sans-serif;
  --radius: 18px;
  --strip-bg: #1E1F1C; --strip-ink: #F2F1EC; --strip-muted: #A5A69E; --strip-active: #F2F1EC; --strip-active-ink: #1E1F1C;
  color-scheme: light;
}
html[data-niche="food"] {
  --page: #E9E7E1; --bg: #FAFAF7; --surface: #FFFFFF; --ink: #1B1B1B; --muted: #6F6F6A;
  --accent: #E0502A; --accent-ink: #FFFFFF; --soft: #FCE4DA; --line: #ECEBE6; --sale: #E0502A;
  --display: "Unbounded", "Arial Black", sans-serif; --display-weight: 700;
}
html[data-niche="flowers"] {
  --page: #0D0A0F; --bg: #16111A; --surface: #221A26; --ink: #F6EDF1; --muted: #B9A7B3;
  --accent: #E7B4C3; --accent-ink: #2A1520; --soft: #3A2933; --line: #33263A; --sale: #F08FA8; --ok: #8FD3A8;
  --display: "Cormorant Garamond", Georgia, serif; --display-weight: 600; --display-style: italic;
  color-scheme: dark;
}
html[data-niche="barber"] {
  --page: #08090A; --bg: #121314; --surface: #1C1D1F; --ink: #F1EEE8; --muted: #9B978F;
  --accent: #C9A063; --accent-ink: #17140F; --soft: #2A2621; --line: #2C2D30; --sale: #E07A5F; --ok: #8FCB9B;
  --display: "Oswald", "Arial Narrow", sans-serif; --display-case: uppercase; --display-weight: 600;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
html { background: var(--page); }
body { background: var(--page); color: var(--ink); font: 15px/1.45 var(--body); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; min-height: 100%; }
img { max-width: 100%; display: block; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.num { font-variant-numeric: tabular-nums; }

/* demo strip */
.strip { background: var(--strip-bg); color: var(--strip-ink); padding-top: env(safe-area-inset-top, 0px); }
.strip-in { max-width: 640px; margin: 0 auto; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; }
.strip-label { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--strip-muted); }
.strip-label b { color: var(--strip-ink); font-weight: 700; }
.strip-tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; max-width: 100%; }
.strip-tabs::-webkit-scrollbar { display: none; }
.strip-tab { white-space: nowrap; padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--strip-ink); border: 1px solid #3A3B37; }
.strip-tab[aria-pressed="true"] { background: var(--strip-active); color: var(--strip-active-ink); border-color: var(--strip-active); }

/* app column */
.stage { padding: 0; }
.app { background: var(--bg); color: var(--ink); max-width: 480px; margin: 0 auto; min-height: 100vh; position: relative; padding-bottom: 104px; }
@media (min-width: 560px) {
  .stage { padding: 28px 16px 48px; }
  .app { border-radius: 30px; overflow: hidden; min-height: 780px; box-shadow: 0 30px 80px -30px rgba(0,0,0,.45); }
  .bar { left: 50% !important; right: auto !important; width: 480px; transform: translateX(-50%); border-radius: 0 0 30px 30px; }
}
.in-tg.solo .strip { display: none; }
.in-tg .app { padding-bottom: 24px; min-height: var(--tg-viewport-stable-height, 100vh); }

/* hero */
.hero { position: relative; }
.cover { height: 168px; background: var(--soft) center/cover no-repeat; position: relative; }
.cover::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.05) 30%, rgba(0,0,0,.45)); }
.brand { padding: 0 20px; margin-top: -34px; position: relative; z-index: 1; display: grid; gap: 10px; }
.logo { width: 68px; height: 68px; border-radius: 22px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font: var(--display-style) var(--display-weight) 26px/1 var(--display); text-transform: var(--display-case); border: 4px solid var(--bg); }
.brand h1 { margin: 0; font: var(--display-style) var(--display-weight) 30px/1.05 var(--display); text-transform: var(--display-case); letter-spacing: .005em; text-wrap: balance; }
html[data-niche="food"] .brand h1 { font-size: 24px; letter-spacing: -.01em; }
html[data-niche="flowers"] .brand h1 { font-size: 36px; }
html[data-niche="barber"] .brand h1 { font-size: 30px; letter-spacing: .03em; }
.tagline { margin: 0; color: var(--muted); max-width: 40ch; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 12.5px; font-weight: 600; }
.chip svg { width: 14px; height: 14px; }
.star { color: #E8A93A; }

.bonus { margin: 16px 20px 0; padding: 14px 16px; border-radius: var(--radius); background: var(--accent); color: var(--accent-ink); display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; }
.bonus b { font: var(--display-style) var(--display-weight) 19px/1.15 var(--display); text-transform: var(--display-case); }
.bonus span { font-size: 13px; opacity: .9; grid-column: 1; }
.bonus .code { grid-row: 1 / span 2; grid-column: 2; font: 700 12px/1 var(--body); letter-spacing: .08em; border: 1.5px dashed currentColor; border-radius: 10px; padding: 8px 10px; }

/* categories */
.cats { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 14px 20px 10px; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.cats::-webkit-scrollbar { display: none; }
.cat { white-space: nowrap; padding: 8px 16px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-weight: 600; font-size: 14px; }
.cat[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.section-title { margin: 18px 20px 10px; font: var(--display-style) var(--display-weight) 22px/1.1 var(--display); text-transform: var(--display-case); }

/* grid */
.grid { padding: 4px 20px 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 12px; }
.card { display: grid; gap: 8px; align-content: start; min-width: 0; }
.ph { position: relative; aspect-ratio: 1; border-radius: var(--radius); overflow: hidden; background: var(--soft); max-width: 100%; }
.ph img { width: 100%; height: 100%; object-fit: cover; transition: transform .35s ease; }
.ph button { position: absolute; inset: 0; }
.ph-fallback { position: absolute; inset: 0; display: grid; place-items: center; font: var(--display-style) var(--display-weight) 34px/1 var(--display); color: var(--muted); }
.badge { position: absolute; top: 10px; left: 10px; background: var(--sale); color: #fff; font-weight: 800; font-size: 12px; padding: 4px 8px; border-radius: 8px; }
.card h3 { margin: 0; font-size: 14.5px; line-height: 1.3; font-weight: 700; min-height: 2.6em; }
.unit { color: var(--muted); font-size: 12.5px; }
.buy { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.price { font-weight: 800; font-size: 16px; }
.price s { display: block; color: var(--muted); font-weight: 500; font-size: 12.5px; line-height: 1.1; }
.sheet .price s { display: inline; margin-left: 6px; font-size: 14px; }
.add { width: 38px; height: 38px; border-radius: 12px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none; }
.add svg { width: 18px; height: 18px; }
.stepper { display: inline-flex; align-items: center; background: var(--accent); color: var(--accent-ink); border-radius: 12px; height: 38px; flex: none; }
.stepper button { width: 32px; height: 38px; display: grid; place-items: center; font-size: 18px; font-weight: 700; }
.stepper span { min-width: 18px; text-align: center; font-weight: 800; }
.stepper.light { background: var(--soft); color: var(--ink); height: 34px; }
.stepper.light button { height: 34px; }

/* bottom bar (browser only; in Telegram the native MainButton is used) */
.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: linear-gradient(180deg, transparent, var(--bg) 30%); }
.main-btn { width: 100%; height: 56px; border-radius: 16px; background: var(--accent); color: var(--accent-ink); font-weight: 800; font-size: 16px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; box-shadow: 0 10px 24px -12px rgba(0,0,0,.5); }
.main-btn[aria-disabled="true"] { opacity: .5; }
.main-btn .count { background: rgba(255,255,255,.22); border-radius: 999px; padding: 2px 9px; font-size: 13px; margin-left: 8px; }
html[data-niche="flowers"] .main-btn .count, html[data-niche="barber"] .main-btn .count { background: rgba(0,0,0,.15); }

/* sheet */
.scrim { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.5); display: grid; align-items: end; justify-items: center; animation: fade .2s ease; }
.sheet { width: 100%; max-width: 480px; background: var(--bg); border-radius: 26px 26px 0 0; padding: 0 0 calc(20px + env(safe-area-inset-bottom, 0px)); max-height: 92vh; overflow-y: auto; animation: up .25s ease; }
.sheet .ph { border-radius: 26px 26px 0 0; aspect-ratio: 4 / 3; }
.sheet-body { padding: 18px 20px 0; display: grid; gap: 10px; }
.sheet h2 { margin: 0; font: var(--display-style) var(--display-weight) 26px/1.1 var(--display); text-transform: var(--display-case); }
.sheet p { margin: 0; color: var(--muted); }
.close { position: absolute; top: 12px; right: 12px; width: 36px; height: 36px; border-radius: 50%; background: rgba(0,0,0,.45); color: #fff; display: grid; place-items: center; z-index: 2; }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }

/* screens */
.top { position: sticky; top: 0; z-index: 6; background: var(--bg); display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line); }
.top h2 { margin: 0; font: var(--display-style) var(--display-weight) 22px/1.1 var(--display); text-transform: var(--display-case); }
.back { width: 38px; height: 38px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); display: grid; place-items: center; flex: none; }
.back svg { width: 18px; height: 18px; }
.in-tg .back { display: none; }
.block { margin: 16px 20px 0; }
.block > h4 { margin: 0 0 10px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.line { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px; }
.line + .line { border-top: 1px solid var(--line); }
.line img, .line .thumb { width: 56px; height: 56px; border-radius: 12px; object-fit: cover; background: var(--soft); }
.line .nm { font-weight: 700; font-size: 14px; line-height: 1.25; }
.line .sub { color: var(--muted); font-size: 12.5px; }
.line .right { display: grid; justify-items: end; gap: 6px; }

.field { display: grid; gap: 6px; padding: 10px 14px; }
.field + .field { border-top: 1px solid var(--line); }
.field label { font-size: 12px; color: var(--muted); font-weight: 600; }
.field input, .field textarea { border: 0; background: transparent; padding: 0; outline: none; font-size: 15.5px; width: 100%; resize: none; }
.field.bad label { color: var(--sale); }
.field input::placeholder, .field textarea::placeholder { color: var(--muted); opacity: .7; }
.err { color: var(--sale); font-size: 12.5px; font-weight: 600; }
.okmsg { color: var(--ok); font-size: 12.5px; font-weight: 700; }

.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px; gap: 4px; }
.seg button { height: 38px; border-radius: 10px; font-weight: 700; font-size: 14px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

.promo { display: flex; gap: 8px; padding: 8px; }
.promo input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 0 8px; outline: none; text-transform: uppercase; font-weight: 700; letter-spacing: .04em; }
.promo button { height: 40px; padding: 0 16px; border-radius: 12px; background: var(--ink); color: var(--bg); font-weight: 700; font-size: 14px; }
.hint { margin: 8px 4px 0; font-size: 12.5px; color: var(--muted); }

.sum { padding: 14px 16px; display: grid; gap: 8px; }
.sum div { display: flex; justify-content: space-between; gap: 12px; }
.sum .tot { border-top: 1px solid var(--line); padding-top: 10px; font-weight: 800; font-size: 18px; }
.sum .disc { color: var(--ok); font-weight: 700; }
.warn { margin: 12px 20px 0; padding: 12px 14px; border-radius: 14px; background: var(--soft); font-size: 13.5px; font-weight: 600; }

/* booking */
.svc { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px; width: 100%; text-align: left; }
.svc + .svc { border-top: 1px solid var(--line); }
.svc img, .svc .thumb { width: 64px; height: 64px; border-radius: 14px; object-fit: cover; background: var(--soft); }
.svc .nm { font-weight: 700; }
.svc .sub { color: var(--muted); font-size: 13px; }
.svc .pr { font-weight: 800; white-space: nowrap; }
.masters { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.masters::-webkit-scrollbar { display: none; }
.master { flex: none; width: 104px; padding: 12px 8px; border-radius: 16px; background: var(--surface); border: 1.5px solid var(--line); display: grid; justify-items: center; gap: 6px; text-align: center; }
.master[aria-pressed="true"] { border-color: var(--accent); }
.ava { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; font: 600 18px/1 var(--display); background: var(--soft); color: var(--accent); text-transform: uppercase; }
.master .nm { font-weight: 700; font-size: 13.5px; line-height: 1.2; }
.master .sub { font-size: 11.5px; color: var(--muted); }
.dates { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.dates::-webkit-scrollbar { display: none; }
.date { flex: none; width: 58px; padding: 10px 0; border-radius: 14px; background: var(--surface); border: 1.5px solid var(--line); display: grid; justify-items: center; gap: 2px; }
.date b { font-size: 18px; }
.date span { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.date[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.date[aria-pressed="true"] span { color: var(--accent-ink); opacity: .85; }
.slots { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.slot { height: 42px; border-radius: 12px; background: var(--surface); border: 1.5px solid var(--line); font-weight: 700; font-size: 14px; }
.slot:disabled { opacity: .35; text-decoration: line-through; cursor: default; }
.slot[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

/* done */
.done-head { padding: 34px 20px 8px; display: grid; justify-items: center; text-align: center; gap: 10px; }
.tick { width: 76px; height: 76px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; animation: pop .45s cubic-bezier(.2,1.4,.4,1); }
.tick svg { width: 36px; height: 36px; }
@keyframes pop { from { transform: scale(.4); opacity: 0; } }
.done-head h2 { margin: 0; font: var(--display-style) var(--display-weight) 28px/1.1 var(--display); text-transform: var(--display-case); }
.done-head p { margin: 0; color: var(--muted); max-width: 34ch; }
.owner { margin: 22px 20px 0; padding: 16px; border-radius: var(--radius); border: 1.5px dashed var(--line); display: grid; gap: 14px; }
.owner > b { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.owner .note { font-size: 13px; color: var(--muted); margin: 0; }
.tgmsg { background: #FFFFFF; color: #1A1A1A; border-radius: 16px 16px 16px 4px; padding: 12px 14px; font-size: 13.5px; line-height: 1.45; box-shadow: 0 1px 2px rgba(0,0,0,.12); white-space: pre-line; }
.tgmsg .who { color: #2A7DC0; font-weight: 700; font-size: 13px; margin-bottom: 4px; }
.tgwrap { background: #CFE3C1; background: linear-gradient(160deg, #CBDDB6, #A9C99A); border-radius: 16px; padding: 14px; }
.sheetmock { border-radius: 12px; overflow: hidden; border: 1px solid #DADCE0; background: #fff; color: #202124; font: 12px/1.3 Arial, sans-serif; }
.sheetmock .ttl { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid #DADCE0; font-size: 12.5px; }
.sheetmock .ttl i { width: 14px; height: 18px; border-radius: 2px; background: #1E8E3E; display: inline-block; }
.sheetscroll { overflow-x: auto; }
.sheetmock table { border-collapse: collapse; min-width: 560px; width: 100%; }
.sheetmock th, .sheetmock td { border: 1px solid #E3E3E3; padding: 5px 7px; text-align: left; white-space: nowrap; }
.sheetmock th { background: #F8F9FA; color: #5F6368; font-weight: 400; text-align: center; }
.sheetmock thead tr + tr th { background: #fff; color: #202124; font-weight: 700; text-align: left; }
.sheetmock td.rn, .sheetmock th.rn { background: #F8F9FA; color: #5F6368; text-align: center; width: 26px; }
.sheetmock tr.new td:not(.rn) { background: #E6F4EA; animation: flash 1.6s ease 2; }
@keyframes flash { 50% { background: #CEEAD6; } }
.cta { margin: 18px 20px 0; display: grid; gap: 10px; }
.ghost { height: 52px; border-radius: 16px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 700; display: grid; place-items: center; text-decoration: none; color: var(--ink); }
.solid { height: 52px; border-radius: 16px; background: var(--accent); color: var(--accent-ink); font-weight: 800; display: grid; place-items: center; text-decoration: none; }
.foot { margin: 28px 20px 0; text-align: center; font-size: 12px; color: var(--muted); }
.foot a { color: inherit; }

/* ---------- motion ---------- */
@keyframes rise { from { opacity: 0; transform: translateY(14px); } }
@keyframes rise-card { from { opacity: 0; transform: translateY(20px) scale(.96); } }
.in { animation: rise .5s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--d, 0) * 60ms); }
.card.in { animation-name: rise-card; animation-delay: calc(var(--d, 0) * 55ms + 100ms); }
.hero.in .logo { animation: pop .55s .15s cubic-bezier(.2,1.4,.4,1) both; }
.cover { will-change: transform; transform-origin: 50% 0; }
.ph::before { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.28) 50%, transparent 70%) var(--soft); background-size: 250% 100%; animation: shimmer 1.3s linear infinite; }
.ph.loaded::before { display: none; }
@keyframes shimmer { from { background-position: 120% 0; } to { background-position: -120% 0; } }
.ph img, .line img, .svc img { opacity: 0; transition: opacity .45s ease, transform .35s ease; }
img.ok { opacity: 1; }
.ph-fallback { display: none; }
.ph.failed .ph-fallback { display: grid; }
.add, .main-btn, .cat, .slot, .date, .master, .svc, .solid, .ghost, .stepper button, .promo button, .seg button, .back, .strip-tab { transition: transform .12s ease, background-color .2s ease, color .2s ease, border-color .2s ease; }
.add:active, .main-btn:active, .cat:active, .slot:active, .date:active, .master:active, .solid:active, .ghost:active, .stepper button:active, .promo button:active, .seg button:active, .back:active { transform: scale(.93); }
.svc:active { transform: scale(.985); }
@keyframes bump { 35% { transform: scale(1.045); } 70% { transform: scale(.99); } }
.main-btn.bump { animation: bump .4s ease; }
.main-btn.in { animation: rise .4s cubic-bezier(.2,.8,.2,1) both; }
@keyframes qty { 40% { transform: scale(1.5); } }
.pop { display: inline-block; animation: qty .3s ease; }
.fly { position: fixed; z-index: 50; border-radius: 16px; object-fit: cover; pointer-events: none; box-shadow: 0 14px 30px rgba(0,0,0,.35); }
@keyframes shake { 20%, 60% { transform: translateX(-7px); } 40%, 80% { transform: translateX(7px); } }

/* ---------------- Cart math ---------------- */
function cartLines() {
  const n = N(); if (n.kind !== "shop") return [];
  return n.items.filter((i) => S.cart[i.id]).map((i) => ({ ...i, qty: S.cart[i.id], sum: i.price * S.cart[i.id] }));
}
function totals() {
  const n = N(); const lines = cartLines();
  const sub = lines.reduce((a, l) => a + l.sum, 0);
  const count = lines.reduce((a, l) => a + l.qty, 0);
  let disc = 0;
  const p = S.promoApplied && CONFIG.PROMOS[S.promoApplied];
  if (p) {
    if (p.type === "pct") disc = Math.round(sub * p.value / 100);
    if (p.type === "fix" && sub >= p.min) disc = p.value;
  }
  let ship = 0;
  if (S.mode === "delivery" && n.delivery.price && sub < n.delivery.freeFrom) ship = n.delivery.price;
  return { lines, sub, count, disc, ship, total: Math.max(0, sub - disc) + ship };
}

}
async function submitBooking() {
  const n = N(); const s = n.services.find((x) => x.id === S.svc);
  if (!validate(["name", "phone"])) { hap.err(); render(); shakeBad(); const bad = document.querySelector(".field.bad input"); bad && bad.scrollIntoView({ block: "center", behavior: REDUCE ? "auto" : "smooth" }); return; }
  progress(true);
  const m = n.masters.find((x) => x.id === S.master);
  const when = `${dayLabel(S.day)} в ${S.time}`;
  const items = [`${s.name}, ${m.id === "any" ? "любой мастер" : m.name}, ${dayDate(S.day).toLocaleDateString("ru-RU")} ${S.time}`];
  const u = tgUser();
  const sent = await sendOrder({ ...u, items, total: s.price, name: S.form.name, phone: S.form.phone, address: "", comment: S.form.comment, shop: n.name });
  S.order = { no: 1200 + Math.floor(Math.random() * 90), items, total: s.price, stamp: stamp(), client: S.form.name, phone: S.form.phone, when, sent, userId: u.userId, user: "@" + u.user };
  progress(false); hap.ok(); go("done"); confetti(); revealOwner();
}
function applyPromo() {
  const code = S.promo.trim().toUpperCase(); const p = CONFIG.PROMOS[code]; const t = totals();
  if (!code) { S.promoApplied = null; S.promoMsg = "Введите промокод"; FX.shake = "promo"; hap.err(); return; }
  if (!p) { S.promoApplied = null; S.promoMsg = `Промокода ${code} нет. Попробуйте START или BONUS500.`; FX.shake = "promo"; hap.err(); return; }
  if (p.type === "fix" && t.sub < p.min) { S.promoApplied = null; S.promoMsg = `${code} работает от ${rub(p.min)}. Добавьте ещё ${rub(p.min - t.sub)}.`; FX.shake = "promo"; hap.err(); return; }
  S.promoApplied = code; S.promo = code; S.promoMsg = `Применён: ${p.label}`; FX.glow = "promo"; hap.ok();
}

document.addEventListener("click", (ev) => {
  const link = ev.target.closest('a[href^="https://t.me/"]');
  if (link && tg && tg.openTelegramLink) { ev.preventDefault(); try { tg.openTelegramLink(link.href); } catch (e) { location.href = link.href; } return; }
  const el = ev.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act, n = N();
  if (a === "close-bg" && ev.target !== el) return;
  switch (a) {
    case "niche": if (S.niche !== el.dataset.n) { S.niche = el.dataset.n; S.view = "menu"; S.cat = "Все"; S.cart = {}; S.sheet = null; S.promo = ""; S.promoApplied = null; S.promoMsg = ""; S.svc = null; S.time = null; S.day = 0; S.master = "any"; S.errors = {}; S.mode = "delivery"; try { history.replaceState(null, "", "#" + S.niche); } catch (e) {} hap.sel(); render(); window.scrollTo(0, 0); } break;
    case "cat": S.cat = el.dataset.cat; hap.sel(); render(); break;
    case "add": {
      const id = el.dataset.id; const first = !S.cart[id];
      const src = first ? (el.closest(".card, .sheet") || document).querySelector(".ph img") : null;
      const from = src && src.classList.contains("ok") ? { r: src.getBoundingClientRect(), src: src.getAttribute("src") } : null;
      S.cart[id] = (S.cart[id] || 0) + 1; FX.pop = id; hap.tap(); revalidatePromo(); render();
      if (from && S.view === "menu") flyToCart(from);
      break;
    }
    case "dec": { const id = el.dataset.id; S.cart[id] = (S.cart[id] || 0) - 1; if (S.cart[id] <= 0) delete S.cart[id]; else FX.pop = id; hap.tap(); revalidatePromo(); render(); break; }
    case "open": S.sheet = el.dataset.id; hap.tap(); render(); break;
    case "close": case "close-bg": closeSheet(); break;
    case "menu": go("menu"); break;
    case "back": goBack(); break;
    case "main": runMain(); break;
    case "promo": applyPromo(); render(); break;
    case "mode": S.mode = el.dataset.mode; hap.sel(); render(); break;
    case "svc": S.svc = el.dataset.id; S.time = null; hap.tap(); go("book"); break;
    case "master": S.master = el.dataset.id; if (S.time && slotBusy(S.day, parseInt(S.time))) S.time = null; hap.sel(); render(); break;
    case "day": S.day = Number(el.dataset.i); if (S.time && slotBusy(S.day, parseInt(S.time))) S.time = null; hap.sel(); render(); break;
    case "time": S.time = el.dataset.t; delete S.errors.time; hap.sel(); render(); break;
    case "restart": S.order = null; S.time = null; go("menu"); break;
  }
});
function revalidatePromo() {
  const p = S.promoApplied && CONFIG.PROMOS[S.promoApplied];
  if (p && p.type === "fix" && totals().sub < p.min) { S.promoMsg = `${S.promoApplied} снят: сумма меньше ${rub(p.min)}.`; S.promoApplied = null; }
}
function goBack() {
  if (S.sheet) { S.sheet = null; render(); return; }
  if (S.view === "done") { S.order = null; go("menu"); return; }
  if (S.view !== "menu") go("menu");
}
document.addEventListener("input", (ev) => {
  const t = ev.target;
  if (t.id === "promo") { S.promo = t.value; return; }
  const k = t.dataset && t.dataset.field; if (!k) return;
  if (k === "phone") { const m = maskPhone(t.value); t.value = t.value.replace(/\D/g, "") ? m : ""; S.form.phone = t.value; }
  else S.form[k] = t.value;
  if (S.errors[k]) { delete S.errors[k]; const f = t.closest(".field"); if (f) { f.classList.remove("bad"); const w = f.querySelector(".why"); w && w.remove(); } }
});
document.addEventListener("keydown", (ev) => {
  if (ev.key === "Escape" && S.sheet) { S.sheet = null; render(); }
  if (ev.key === "Enter" && ev.target.id === "promo") { applyPromo(); render(); }
});

/* ---------------- Boot ---------------- */
function pickNiche(startParam) {
  const h = (location.hash || "").replace("#", "").split(/[&?]/)[0];
  const cand = [startParam, h].find((x) => x && NICHES[x]);
  if (cand) S.niche = cand;
  return !!(startParam && NICHES[startParam]);
}
function boot() {
  if (tg && !tg.initData && !(tg.initDataUnsafe && tg.initDataUnsafe.user)) tg = null; // скрипт загрузился, но мы не в Telegram
  if (tg) {
    document.body.classList.add("in-tg");
    try { tg.ready(); tg.expand(); } catch (e) {}
    try { tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (e) {}
    if (pickNiche(tg.initDataUnsafe && tg.initDataUnsafe.start_param)) document.body.classList.add("solo");
    try { tg.MainButton.onClick(runMain); tg.BackButton.onClick(goBack); } catch (e) {}
    const u = tg.initDataUnsafe && tg.initDataUnsafe.user;
    if (u && u.first_name) S.form.name = u.first_name;
  } else pickNiche();
  render();
}
window.addEventListener("hashchange", () => { const before = S.niche; pickNiche(); if (S.niche !== before) { S.view = "menu"; S.cart = {}; render(); } });

if (inTelegram) {
  const s = document.createElement("script");
  s.src = "https://telegram.org/js/telegram-web-app.js";
  s.onload = () => { tg = window.Telegram && window.Telegram.WebApp; boot(); };
  s.onerror = boot;
  document.head.appendChild(s);
} else boot();
</script>
